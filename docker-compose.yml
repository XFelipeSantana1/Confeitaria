# Banco do projeto em container. A senha NÃO está aqui: vem do `.env` da raiz
# (que é ignorado pelo Git). Sem aquele arquivo, o `docker compose up` falha
# com uma mensagem dizendo qual variável falta — de propósito, porque um
# `valor-padrão` no compose é senha publicada junto com o código.
#
#   cp .env.example .env   (na raiz)   e preencha MYSQL_PASSWORD etc.

services:
  mysql:
    image: mysql:8.4
    container_name: minha-api-mysql
    restart: unless-stopped
    environment:
      # O `:?` faz o Compose PARAR se a variável não estiver no `.env`.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD no .env da raiz}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?defina MYSQL_DATABASE no .env da raiz}
      MYSQL_USER: ${MYSQL_USER:?defina MYSQL_USER no .env da raiz}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD no .env da raiz}
    ports:
      - "3306:3306"
    volumes:
      # Volume nomeado: sem ele, um `docker compose down` apaga o banco.
      # (As FOTOS não estão aqui: o backend roda na máquina e as guarda em
      # `backend/uploads`. Ver a seção "Estrutura" do README.)
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
